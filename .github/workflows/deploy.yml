name: Build and Deploy to Azure App Service

on:
  push:
    branches: [development, main]
  pull_request:
    branches: [development, main]
  workflow_dispatch:

env:
  DOTNET_VERSION: '8.0.x'
  PROJECT_PATH: Dsw2025Tpi.Api/Dsw2025Tpi.Api.csproj

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Obtener el código
        uses: actions/checkout@v4

      - name: 2. Instalar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 3. Restaurar paquetes
        run: dotnet restore Dsw2025Tpi.sln

      - name: 4. Compilar
        run: dotnet build Dsw2025Tpi.sln --configuration Release --no-restore

      - name: 5. Publicar la API
        run: dotnet publish ${{ env.PROJECT_PATH }} --configuration Release --no-build --output ./publish

      - name: 6. Guardar el artefacto
        uses: actions/upload-artifact@v4
        with:
          name: api-publish
          path: ./publish

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Obtener el código
        uses: actions/checkout@v4

      - name: 2. Construir la imagen Docker
        run: docker build -t dsw-api:${{ github.sha }} -f Dockerfile .

  deploy:
    needs: [build, docker-build]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: 1. Descargar el artefacto
        uses: actions/download-artifact@v4
        with:
          name: api-publish
          path: ./publish

      - name: 2. Desplegar en Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.APP_SERVICE_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./publish
